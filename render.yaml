databases: []

services:
  - type: web
    name: electronics-store-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false # paste your Neon POOLED connection string here (used by the running app)
      - key: DIRECT_URL
        sync: false # paste your Neon DIRECT (non-pooled) connection string here (used by prisma migrate deploy in the build step)
      - key: JWT_SECRET
        generateValue: true # Render generates a secure random value automatically
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false # fill in with the frontend's URL once it's deployed below
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false

  - type: web
    name: electronics-store-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false # fill in with https://<electronics-store-api URL>/api once the backend is deployed above
      - key: VITE_PAYSTACK_PUBLIC_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
